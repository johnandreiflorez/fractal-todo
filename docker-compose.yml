services:
  db:
    image: postgres:16-alpine
    container_name: fractal_todo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo123
      POSTGRES_DB: todo_list
    ports:
      - "5432:5432"
    volumes:
      - fractal_todo_pgdata:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo_list"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fractal_todo_pgdata: